name: Release Windows

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  XWIN_CACHE_DIR: ${{ github.workspace }}/.cache/cargo-xwin

jobs:
  release-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate release configuration
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          test -n "$UPDATER_PRIVATE_KEY" || { echo 'Missing secret TAURI_SIGNING_PRIVATE_KEY' >&2; exit 1; }
          test -n "$UPDATER_PRIVATE_KEY_PASSWORD" || { echo 'Missing secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD' >&2; exit 1; }
          test -n "$UPDATER_PUBLIC_KEY" || { echo 'Missing variable TAURI_UPDATER_PUBLIC_KEY' >&2; exit 1; }

      - name: Install cross-build system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang lld llvm nsis

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install cached cargo-xwin
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-xwin
          version: '0.21.4'

      - name: Cache Windows SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.XWIN_CACHE_DIR }}
          key: xwin-${{ runner.os }}-0.21.4-x86_64-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: windows-x64-xwin
          cache-all-crates: true
          cache-on-failure: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set release version and updater public key
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version: $version" >&2; exit 1; }
          sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"$version\"/" apps/desktop/src-tauri/Cargo.toml
          jq --arg version "$version" '.version = $version' \
            apps/desktop/package.json > package.json.tmp
          mv package.json.tmp apps/desktop/package.json
          jq --arg version "$version" --arg pubkey "$UPDATER_PUBLIC_KEY" \
            '.version = $version | .plugins.updater.pubkey = $pubkey' \
            apps/desktop/src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp apps/desktop/src-tauri/tauri.conf.json

      - name: Build and publish signed Windows release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bun tauri
          tagName: ${{ github.ref_name }}
          releaseName: OBS Playing ${{ github.ref_name }}
          releaseBody: Download the NSIS setup executable below. Installed applications receive this release through the built-in updater.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis

name: Release Windows

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release configuration
        shell: pwsh
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_PRIVATE_KEY)) { throw 'Missing secret TAURI_SIGNING_PRIVATE_KEY' }
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_PRIVATE_KEY_PASSWORD)) { throw 'Missing secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD' }
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_PUBLIC_KEY)) { throw 'Missing variable TAURI_UPDATER_PUBLIC_KEY' }

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set release version and updater public key
        shell: pwsh
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $version" }
          $cargoPath = 'apps/desktop/src-tauri/Cargo.toml'
          $cargo = Get-Content $cargoPath -Raw
          $cargo = $cargo -replace '(?m)^(version = )"[^"]+"', "`$1`"$version`""
          Set-Content $cargoPath $cargo
          $configPath = 'apps/desktop/src-tauri/tauri.conf.json'
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config | Add-Member -NotePropertyName version -NotePropertyValue $version -Force
          $config.plugins.updater.pubkey = $env:UPDATER_PUBLIC_KEY
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath

      - name: Build and publish signed Windows release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bun tauri
          tagName: ${{ github.ref_name }}
          releaseName: OBS Playing ${{ github.ref_name }}
          releaseBody: Download the NSIS setup executable or MSI package below. Installed applications receive this release through the built-in updater.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: --bundles nsis,msi
